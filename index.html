<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>排班總覽</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', system-ui, sans-serif; background: #1C1815; color: #F2EBDD; }
  .page { max-width: 1100px; margin: 0 auto; padding: 20px 14px calc(88px + env(safe-area-inset-bottom)); }
  header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .eyebrow { font-size: 12px; letter-spacing: 2px; color: #C9A03E; margin-bottom: 4px; }
  h1 { font-family: Georgia, 'Noto Serif TC', serif; font-size: 24px; margin: 0; font-weight: 600; }
  .month-nav { display: flex; align-items: center; gap: 14px; background: #262019; border-radius: 10px; padding: 8px 16px; }
  .nav-arrow { font-size: 24px; color: #C9A03E; user-select: none; padding: 4px 8px; cursor:pointer; }
  .month-label { font-size: 16px; min-width: 96px; text-align: center; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
  .btn { padding: 11px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
  .shine { position: relative; overflow: hidden; background-size: 220% 220% !important; animation: chromeShift 7s ease-in-out infinite; }
  .shine::after { content: ""; position: absolute; top: -30%; left: -60%; width: 35%; height: 160%; background: linear-gradient(120deg, transparent, rgba(255,255,255,0.85), transparent); transform: skewX(-20deg); animation: shineSweep 3.2s ease-in-out infinite; pointer-events: none; }
  @keyframes chromeShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  @keyframes shineSweep { 0% { left: -60%; } 45% { left: 130%; } 100% { left: 130%; } }
  .chrome-silver { background: linear-gradient(160deg, #fafafa 0%, #d4d4d4 25%, #f4f4f4 45%, #aaaaaa 65%, #eaeaea 85%, #c7c7c7 100%); color: #2a2a2a; border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), inset 0 -2px 3px rgba(0,0,0,0.25), 0 3px 8px rgba(0,0,0,0.35); }
  .chrome-gold { background: linear-gradient(160deg, #fff6d8 0%, #e7c465 25%, #fff0b8 45%, #a8781f 65%, #f6e0a3 85%, #cda247 100%); color: #3a2e12; border: 1px solid rgba(255,244,200,0.6); box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), inset 0 -2px 3px rgba(0,0,0,0.3), 0 3px 8px rgba(0,0,0,0.35); }
  .chrome-rose { background: linear-gradient(160deg, #ffe3ea 0%, #e8a0b5 25%, #ffd6e0 45%, #b45770 65%, #f8c3d1 85%, #d98aa0 100%); color: #3a1520; border: 1px solid rgba(255,230,236,0.6); box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), inset 0 -2px 3px rgba(0,0,0,0.3), 0 3px 8px rgba(0,0,0,0.35); }
  .btn.primary { font-weight: 600; }
  .sync-status { font-size: 12px; color: #8A8175; margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #6B6459; display: inline-block; }
  .sync-dot.ok { background: #8FBF8F; }
  .sync-dot.err { background: #D98A8A; }
  .sync-dot.busy { background: #E8C36A; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .legend-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #322A22; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .legend-text { font-size: 12.5px; color: #C7BEB0; }
  .panel { background: #262019; border-radius: 10px; padding: 14px; margin-bottom: 16px; display: none; }
  .panel.open { display: block; }
  .panel-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .panel-row input[type=text] { flex: 1; min-width: 160px; padding: 12px 12px; border-radius: 8px; border: 1px solid #45413A; background: #1C1815; color: #F2EBDD; font-size: 16px; outline: none; }
  .staff-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: flex; align-items: center; gap: 8px; background: #322A22; border-radius: 20px; padding: 8px 12px 8px 14px; font-size: 14px; }
  .chip .rm { color: #D98A8A; cursor: pointer; font-size: 15px; padding: 2px 4px; }
  .empty-text { font-size: 13px; color: #8A8175; }
  .save-status { font-size: 12px; color: #8A8175; margin-bottom: 12px; min-height: 16px; }
  .save-status.ok { color: #8FBF8F; }
  .save-status.err { color: #D98A8A; }
  .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; text-align: center; font-size: 11px; color: #8A8175; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
  .calendar-day { background: #241E17; border-radius: 8px; padding: 6px 4px; min-height: 60px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; border: 1px solid transparent; }
  .calendar-day.empty { background: transparent; cursor: default; }
  .calendar-day.today { border-color: #C9A03E; }
  .calendar-day .date-num { font-size: 13px; font-weight: 700; color: #C7BEB0; }
  .calendar-day.weekend .date-num { color: #D98A8A; }
  .calendar-day .day-dots { display: flex; flex-wrap: wrap; gap: 3px; }
  .calendar-day .day-dot { width: 8px; height: 8px; border-radius: 2px; }
  .calendar-day .day-count { font-size: 10px; color: #8A8175; margin-top: auto; }
  .month-summary { background: #262019; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .month-summary-title { font-size: 13px; font-weight: 600; color: #C9A03E; margin-bottom: 8px; }

<body>

<div class="setup-overlay" id="setupOverlay" style="display:none"><div class="setup-box"><h2>設定同步網址</h2><p>請貼上部署好的 Google Apps Script 網頁應用程式網址（結尾通常是 /exec）。</p><input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/xxxx/exec"><div class="err" id="setupErr"></div><span class="btn primary chrome-gold shine" id="saveApiUrlBtn">儲存並開始使用</span><div class="version-tag" id="versionTagSetup"></div></div></div>
<div class="setup-overlay" id="unlockOverlay" style="display:none"><div class="setup-box"><h2>輸入密碼解鎖編輯</h2><p>排班編輯與人員名單管理需要密碼才能操作。</p><input type="password" id="unlockPasswordInput" placeholder="請輸入密碼" inputmode="numeric"><div class="err" id="unlockErr"></div><div class="clock-row" style="margin-top:4px;"><span class="btn primary chrome-gold shine" id="unlockSubmitBtn">解鎖</span><span class="btn chrome-silver shine" id="unlockCancelBtn">取消</span></div><div class="version-tag" id="versionTagUnlock"></div></div></div>
<div class="setup-overlay" id="dayDetailOverlay" style="display:none"><div class="setup-box" id="dayDetailBox" style="max-width:480px; max-height:80vh; overflow-y:auto;"><h2 id="dayDetailTitle">日期</h2><div id="dayDetailList"></div><span class="btn chrome-silver shine" id="dayDetailCloseBtn" style="width:100%; margin-top:12px;">關閉</span><div class="version-tag" id="versionTagDay"></div></div></div>
<script>
(function(){
  var SHIFT_ORDER=["","day","night","full","off"];
  var SHIFT_META={"":{label:"－",full:"未排班",bg:"#FBF9F4",fg:"#B9AF9E"},day:{label:"早",full:"早班 09:00–17:00",bg:"#F2C14E",fg:"#3A2E12"},night:{label:"晚",full:"晚班 17:00–02:00",bg:"#E893A8",fg:"#4A1F2B"},full:{label:"全",full:"全天班 09:00–02:00",bg:"#C0392B",fg:"#FCEAE7"},off:{label:"休",full:"休假",bg:"#5B564E",fg:"#EDE7DA"}};
  var WEEKDAY_ZH=["日","一","二","三","四","五","六"];
  var API_URL_KEY="shift-scheduler:api-url";
  var LOCAL_CACHE_KEY="shift-scheduler:cache-v3";
  var DEVICE_ID_KEY="shift-scheduler:device-id";
  var POLL_INTERVAL_MS=20000;
  var STORE_LAT=24.1382662, STORE_LNG=120.6450695, ALLOWED_RADIUS_M=200;
  var UNLOCK_PASSWORD="0706", UNLOCK_SESSION_KEY="shift-scheduler:unlocked";
  var pendingUnlockCallback=null;

  // ---- 多裝置同步狀態 ----
  var isPushing=false;
  var pushQueue=[]; // 存 backupVersion
  var syncStage="idle"; // idle, fetching, comparing, remoteNewer, localNewer, merging, pushing, synced, error

  function getDeviceId(){
    var id=localStorage.getItem(DEVICE_ID_KEY);
    if(!id){ id="dev-"+Math.random().toString(36).slice(2,6); localStorage.setItem(DEVICE_ID_KEY,id); }
    return id;
  }
  function hashString(str){
    var hash=0; for(var i=0;i<str.length;i++){ var c=str.charCodeAt(i); hash=((hash<<5)-hash)+c; hash|=0; }
    return Math.abs(hash).toString(36);
  }
  function computeChecksum(obj){
    try{
      var core=JSON.stringify({staffList:obj.staffList||[], schedules:obj.schedules||{}, clockins:obj.clockins||{}});
      return hashString(core).slice(0,8);
    }catch(e){ return "0000"; }
  }
  function diffCount(remote, local){
    var c=0;
    var rIds=new Set((remote.staffList||[]).map(s=>s.id));
    var lIds=new Set((local.staffList||[]).map(s=>s.id));
    rIds.forEach(id=>{ if(!lIds.has(id)) c++; });
    lIds.forEach(id=>{ if(!rIds.has(id)) c++; });
    // 排班差異
    var allYM=new Set([...Object.keys(remote.schedules||{}), ...Object.keys(local.schedules||{})]);
    allYM.forEach(ym=>{
      var rYm=remote.schedules[ym]||{}, lYm=local.schedules[ym]||{};
      var allStaff=new Set([...Object.keys(rYm), ...Object.keys(lYm)]);
      allStaff.forEach(sid=>{
        var rDays=rYm[sid]||{}, lDays=lYm[sid]||{};
        var allDays=new Set([...Object.keys(rDays), ...Object.keys(lDays)]);
        allDays.forEach(d=>{ if(rDays[d]!==lDays[d]) c++; });
      });
    });
    return c;
  }

  function isUnlocked(){ return sessionStorage.getItem(UNLOCK_SESSION_KEY)==="1"; }
  function lockNow(){ sessionStorage.removeItem(UNLOCK_SESSION_KEY); updateLockUI(); }
  function requestUnlock(cb){
    pendingUnlockCallback=cb;
    var overlay=document.getElementById("unlockOverlay");
    document.getElementById("unlockPasswordInput").value="";
    document.getElementById("unlockErr").textContent="";
    overlay.style.display="flex";
    updateVersionTags();
  }
  function updateLockUI(){
    var locked=!isUnlocked();
    document.getElementById("lockToggleBtn").textContent=locked?"\uD83D\uDD12 編輯已鎖定（點擊解鎖）":"\uD83D\uDD13 編輯已解鎖（點擊鎖定）";
    var qBtn=document.getElementById("querySubmitBtn"); if(qBtn) qBtn.textContent=locked?"輸入密碼後查詢":"查詢";
    var qTitle=document.getElementById("queryTitle"); if(qTitle) qTitle.textContent=locked?"打卡紀錄查詢 \uD83D\uDD12":"打卡紀錄查詢 \uD83D\uDD13";
  }
  function updateVersionTags(){
    var v=state.version||0;
    var chk=state.checksum||computeChecksum(state);
    var dev=getDeviceId();
    var stageMap={idle:"待機",fetching:"讀取中",comparing:"對比中",remoteNewer:"雲端較新",localNewer:"本地較新",merging:"合併中",pushing:"同步中",synced:"已同步",error:"同步失敗"};
    var stageText=stageMap[syncStage]||syncStage;
    var txt="版本 v"+v+" · "+chk+" · "+dev+" · "+stageText+(isPushing?" · 推送中":"")+(pushQueue.length?" · 佇列"+pushQueue.length:"");
    document.querySelectorAll(".version-tag").forEach(el=>el.textContent=txt);
  }
  function setSyncStatus(mode,text,stage){
    if(stage) syncStage=stage;
    var dot=document.getElementById("syncDot");
    var t=document.getElementById("syncText");
    if(dot) dot.className="sync-dot"+(mode?" "+mode:"");
    if(t) t.textContent=text;
    updateVersionTags();
  }

  function haversineDistance(lat1,lng1,lat2,lng2){
    var R=6371000; var toRad=d=>d*Math.PI/180;
    var dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
    var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }
  function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function pad2(n){ return String(n).padStart(2,"0"); }
  var today=new Date();
  var state={year:today.getFullYear(),month:today.getMonth()+1,staffList:[],schedules:{},clockins:{},version:0,checksum:"0000",lastModified:0,deviceId:getDeviceId()};
  var DEFAULT_API_URL="https://script.google.com/macros/s/AKfycbxCJVTtQF8YyGYFsT89hG2mEJHV1KR-3rQYzA86Ehznc5zoDqSffah5bYSxmlq_JZIC/exec";
  var apiUrl=localStorage.getItem(API_URL_KEY)||DEFAULT_API_URL;
  var pollTimer=null;

  function pad(n){ return String(n).padStart(2,"0"); }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
  function ymKey(y,m){ return y+"-"+pad(m); }
  function flashSaveStatus(text,cls){
    var el=document.getElementById("saveStatus");
    el.textContent=text; el.className="save-status "+(cls||"");
    setTimeout(function(){ el.textContent=""; el.className="save-status"; },2200);
  }
  function cacheLocally(){
    try{
      state.checksum=computeChecksum(state);
      state.lastModified=Date.now();
      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({staffList:state.staffList,schedules:state.schedules,clockins:state.clockins,version:state.version,checksum:state.checksum,lastModified:state.lastModified}));
    }catch(e){}
  }
  function loadLocalCache(){
    try{
      var raw=localStorage.getItem(LOCAL_CACHE_KEY)||localStorage.getItem("shift-scheduler:cache-v2")||localStorage.getItem("shift-scheduler:cache");
      if(raw){ var d=JSON.parse(raw); state.staffList=d.staffList||[]; state.schedules=d.schedules||{}; state.clockins=d.clockins||{}; state.version=d.version||0; state.checksum=d.checksum||computeChecksum(state); state.lastModified=d.lastModified||0; }
    }catch(e){}
  }
  function mergeStaffLists(remoteList,localList){
    var map={}; (remoteList||[]).forEach(s=>map[s.id]=s); (localList||[]).forEach(s=>map[s.id]=s); return Object.values(map);
  }
  function mergeSchedules(remoteSched,localSched){
    var result=JSON.parse(JSON.stringify(remoteSched||{}));
    Object.keys(localSched||{}).forEach(ym=>{
      if(!result[ym]) result[ym]={};
      Object.keys(localSched[ym]||{}).forEach(staffId=>{
        if(!result[ym][staffId]) result[ym][staffId]={};
        Object.keys(localSched[ym][staffId]||{}).forEach(day=>{ result[ym][staffId][day]=localSched[ym][staffId][day]; });
      });
    });
    return result;
  }
  function mergeClockins(remoteClock,localClock){
    var result=JSON.parse(JSON.stringify(remoteClock||{}));
    Object.keys(localClock||{}).forEach(date=>{
      if(!result[date]) result[date]={};
      Object.keys(localClock[date]||{}).forEach(staffId=>{
        if(!result[date][staffId]) result[date][staffId]=[];
        var keys=new Set(result[date][staffId].map(r=>r.type+"|"+r.time));
        (localClock[date][staffId]||[]).forEach(rec=>{ var k=rec.type+"|"+rec.time; if(!keys.has(k)){ result[date][staffId].push(rec); keys.add(k); } });
      });
    });
    return result;
  }
  function mergeState(remote,local){
    return {staffList:mergeStaffLists(remote.staffList,local.staffList), schedules:mergeSchedules(remote.schedules,local.schedules), clockins:mergeClockins(remote.clockins,local.clockins)};
  }

  // ---- 核心同步：美容師版邏輯 ----
  function fetchRemote(){
    setSyncStatus("busy","讀取中...", "fetching");
    return fetch(apiUrl,{method:"GET"})
      .then(res=>res.json())
      .then(data=>{
        var remoteVersion=data.version||0;
        var remote={staffList:data.staffList||[], schedules:data.schedules||{}, clockins:data.clockins||{}};
        var remoteChecksum=data.checksum||computeChecksum(remote);
        var localChecksum=computeChecksum(state);

        // 對比中
        setSyncStatus("busy","對比中 v"+state.version+" vs v"+remoteVersion+" ...","comparing");

        // 防呆：雲端空
        if((remote.staffList||[]).length===0 && state.staffList.length>0 && remoteVersion===0){
          setSyncStatus("ok","防呆保留本地 v"+state.version+" (雲端空)","synced");
          return data;
        }

        var diff=diffCount(remote,state);

        if(remoteVersion>state.version){
          // 雲端較新
          setSyncStatus("busy","雲端較新 v"+remoteVersion+" 套用中...","remoteNewer");
          state.staffList=remote.staffList; state.schedules=remote.schedules; state.clockins=remote.clockins; state.version=remoteVersion; state.checksum=remoteChecksum;
          cacheLocally();
          setSyncStatus("ok","已同步 v"+state.version+" · 雲端較新","synced");
        }else if(remoteVersion<state.version){
          // 本地較新
          setSyncStatus("busy","本地較新 v"+state.version+" 等待推送...","localNewer");
          // 自動排程推送
          requestPush(state.version-1);
          setSyncStatus("ok","本地較新 v"+state.version+" 已排程推送","localNewer");
        }else{
          // 版本相同
          if(remoteChecksum===localChecksum && diff===0){
            setSyncStatus("ok","已同步 v"+state.version+" · "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}),"synced");
          }else{
            // 衝突
            setSyncStatus("busy","對比中發現 "+diff+" 項差異，合併中...","merging");
            var merged=mergeState(remote,state);
            var newVersion=state.version+1;
            state.staffList=merged.staffList; state.schedules=merged.schedules; state.clockins=merged.clockins; state.version=newVersion; state.checksum=computeChecksum(state);
            cacheLocally();
            setSyncStatus("busy","衝突已合併 v"+newVersion+" 推送中...","merging");
            requestPush(newVersion-1);
          }
        }
        return data;
      });
  }

  function doActualPush(oldestBackup){
    isPushing=true;
    updateVersionTags();
    setSyncStatus("busy","同步中 v"+state.version+"...","pushing");
    return fetch(apiUrl,{method:"GET"})
      .then(res=>res.json())
      .then(remoteData=>{
        var remoteVersion=remoteData.version||0;
        var remoteState={staffList:remoteData.staffList||[], schedules:remoteData.schedules||[], clockins:remoteData.clockins||{}};
        var payload;
        if(remoteVersion>oldestBackup){
          // 期間有人改過，合併
          setSyncStatus("busy","對比中 v"+oldestBackup+"→v"+remoteVersion+" 合併...","merging");
          var merged=mergeState(remoteState,state);
          payload={staffList:merged.staffList, schedules:merged.schedules, clockins:merged.clockins, version:Math.max(remoteVersion,state.version)+1, checksum:computeChecksum(merged), lastModified:Date.now(), deviceId:getDeviceId()};
        }else{
